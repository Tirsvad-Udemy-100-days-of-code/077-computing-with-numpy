# Runs the tests, the linters and the type checker for the project.
# Implements: MIL-001 task 5 (CI workflow for tests).
# Starts on: push to main, and every pull_request.
# Inputs: none. Secrets needed: none. Changes nothing outside the runner.
# Verified on: Gitea 28.3.0 (Actions, act_runner); no GitHub-only feature is used.
# Tool versions are pinned in constraints.txt; the actions are pinned to commit hashes.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install Python 3.13
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.13"
      - name: Install the project and its development tools
        run: |
          python -m pip install pip==26.3
          python -m pip install -c constraints.txt -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Check formatting with ruff
        run: ruff format --check .
      - name: Lint YAML with yamllint
        run: yamllint .gitea .yamllint
      - name: Check types with mypy
        run: mypy src
      - name: Run the tests
        run: python -m pytest
